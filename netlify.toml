[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  # React Router 7 and Netlify Blobs need Node 20+
  NODE_VERSION = "20"
  CI = "false"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Starter articles loaded into a new, empty store
  included_files = ["server/seed/**"]

# Single-page app: every route that isn't a file serves index.html.
# /api/* (Netlify Function) and /article/* (edge function for share previews) run first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
